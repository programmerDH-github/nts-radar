<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>국세레이더</title>
<meta name="description" content="국세청 새 소식을 한눈에">
<meta name="theme-color" content="#0a1e37">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="국세레이더">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --navy: #0a1e37;
    --navy-light: #16325a;
    --green: #3ccf8e;
    --bg: #f3f5f9;
    --card: #ffffff;
    --hover: #eefaf4;
    --line: #e6e9ef;
    --text: #1f2937;
    --text-read: #8a93a3;
    --sub: #9aa4b5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1520;
      --card: #152131;
      --hover: #183428;
      --line: #22314a;
      --text: #e8edf5;
      --text-read: #6b778a;
      --sub: #7d8aa0;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "맑은 고딕", "Malgun Gothic", sans-serif; }
  button { font: inherit; border: 0; cursor: pointer; }

  header { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 10;
    padding: calc(env(safe-area-inset-top) + 14px) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .top { display: flex; align-items: center; gap: 12px; max-width: 980px; margin: 0 auto; }
  .top img { width: 42px; height: 42px; flex: none; }
  .titles { flex: 1; min-width: 0; }
  .titles h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
  #status { font-size: 12.5px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.new { color: var(--green); }
  .btn { padding: 9px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .btn.ghost { background: transparent; color: var(--sub); }
  .btn.solid { background: var(--navy-light); color: #fff; }
  .btn.solid:active, .btn.solid.loading { background: var(--green); color: var(--navy); }
  .btn.ghost:active { color: #fff; }
  @media (hover: hover) {
    .btn.solid:hover { background: var(--green); color: var(--navy); }
    .btn.ghost:hover { color: #fff; background: var(--navy-light); }
  }

  nav { display: flex; gap: 2px; max-width: 980px; margin: 10px auto 0; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  .seg { display: flex; flex: none; align-self: center; background: var(--navy-light); border-radius: 8px; padding: 3px; margin-right: 10px; }
  .seg button { background: none; color: var(--sub); font-size: 13.5px; font-weight: 700; padding: 5px 12px; border-radius: 6px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .seg button.active { background: var(--green); color: var(--navy); }
  .seg .gdot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .tab { background: none; color: var(--sub); padding: 10px 12px 11px; font-size: 15px; white-space: nowrap;
    border-bottom: 3px solid transparent; display: flex; align-items: center; gap: 6px; }
  .tab.active { color: #fff; font-weight: 700; border-bottom-color: var(--green); }
  .count { background: var(--green); color: var(--navy); font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 4px; }

  main { max-width: 980px; margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(16px, env(safe-area-inset-left)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 15px 18px; color: inherit; text-decoration: none;
    border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row:active { background: var(--hover); }
  @media (hover: hover) { .row:hover { background: var(--hover); } }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .unread .dot { background: var(--green); }
  .badge { flex: none; color: #fff; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .title { flex: 1; min-width: 0; font-size: 15.5px; line-height: 1.45; color: var(--text-read); word-break: keep-all; overflow-wrap: anywhere; }
  .unread .title { color: var(--text); font-weight: 700; }
  .date { flex: none; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .empty { padding: 48px 16px; text-align: center; color: var(--sub); }
  footer { display: flex; align-items: center; gap: 6px; margin: 12px 4px 0; font-size: 12.5px; color: var(--sub); }
  footer .dot { background: var(--green); }

  @media (max-width: 560px) {
    .btn.ghost { display: none; }
    .row { flex-wrap: wrap; gap: 6px 10px; padding: 13px 14px; }
    .title { flex-basis: 100%; order: 3; }
    .date { margin-left: auto; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="icon-192.png" alt="">
    <div class="titles">
      <h1>국세레이더</h1>
      <div id="status">국세청 새 소식을 확인하는 중…</div>
    </div>
    <button class="btn ghost" id="readAll">✓ 모두 읽음</button>
    <button class="btn solid" id="refresh">⟳ 새로고침</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main>
  <div class="card" id="list"></div>
  <footer><span class="dot"></span> 아직 안 읽은 글 · 누르면 국세청 원문이 열립니다</footer>
</main>

<script>
const BADGE = { "보도": "#2563eb", "설명": "#0891b2", "공지": "#7c3aed", "고시": "#ea580c", "공고": "#059669", "세제": "#b45309", "해석": "#0d9488", "심판": "#be185d", "판례": "#4f46e5", "법령": "#475569" };
const READ_KEY = "nts-radar-read";
const TAB_KEY = "nts-radar-tab";

let data = null;
let current = load(TAB_KEY, "전체");
let group = null;
let readIds = new Set(load(READ_KEY, []));

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
const isUnread = it => !readIds.has(it.id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function refresh() {
  const btn = document.getElementById("refresh");
  btn.classList.add("loading");
  btn.textContent = "⟳ 불러오는 중…";
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
    if (!data.tabs.some(t => t.name === current)) current = data.tabs[0].name;
    render();
  } catch (e) {
    const s = document.getElementById("status");
    s.className = "";
    s.textContent = "불러오기 실패 · 인터넷 연결을 확인해 주세요";
  } finally {
    btn.classList.remove("loading");
    btn.textContent = "⟳ 새로고침";
  }
}

function render() {
  if (!data) return;
  const unreadAll = new Set();
  data.tabs.forEach(t => t.items.forEach(it => isUnread(it) && unreadAll.add(it.id)));
  const status = document.getElementById("status");
  status.className = unreadAll.size ? "new" : "";
  status.textContent = `${unreadAll.size ? `새 글 ${unreadAll.size}개` : "새 글 없음"} · ${data.updated.slice(5).replace("-", ".")} 갱신`;

  const groups = data.groups || [{ name: "전체", tabs: data.tabs.map(t => t.name) }];
  group = groups.find(g => g.tabs.includes(current)) || groups[0];
  const segHtml = groups.length > 1 ? `<div class="seg">${groups.map(g => {
    const hasNew = g !== group && data.tabs.some(t => g.tabs.includes(t.name) && t.items.some(isUnread));
    return `<button class="${g === group ? "active" : ""}" data-group="${esc(g.name)}">${esc(g.name)}${hasNew ? '<span class="gdot"></span>' : ""}</button>`;
  }).join("")}</div>` : "";
  document.getElementById("tabs").innerHTML = segHtml + data.tabs.filter(t => group.tabs.includes(t.name)).map(t => {
    const n = t.items.filter(isUnread).length;
    return `<button class="tab${t.name === current ? " active" : ""}" data-tab="${esc(t.name)}">
      ${esc(t.name)}${n ? `<span class="count">${n}</span>` : ""}</button>`;
  }).join("");

  const items = data.tabs.find(t => t.name === current).items;
  document.getElementById("list").innerHTML = items.length ? items.map(it => `
    <a class="row${isUnread(it) ? " unread" : ""}" href="${esc(it["링크"])}" target="_blank" rel="noopener" data-id="${it.id}">
      <span class="dot"></span>
      <span class="badge" style="background:${BADGE[it["구분"]] || "#9aa4b5"}">${esc(it["구분"])}</span>
      <span class="title">${esc(it["제목"])}</span>
      <span class="date">${it["날짜"].replace(/\.$/, "")}</span>
    </a>`).join("") : `<div class="empty">표시할 글이 없습니다</div>`;
}

const lastTab = load("nts-radar-lasttab", {});
document.getElementById("tabs").addEventListener("click", e => {
  const g = e.target.closest("[data-group]");
  if (g) {
    const target = (data.groups || []).find(x => x.name === g.dataset.group);
    if (!target) return;
    lastTab[group.name] = current;
    save("nts-radar-lasttab", lastTab);
    current = target.tabs.includes(lastTab[target.name]) ? lastTab[target.name] : target.tabs[0];
    save(TAB_KEY, current);
    render();
    window.scrollTo({ top: 0 });
    return;
  }
  const tab = e.target.closest(".tab");
  if (!tab) return;
  current = tab.dataset.tab;
  save(TAB_KEY, current);
  render();
  window.scrollTo({ top: 0 });
});
document.getElementById("list").addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  readIds.add(row.dataset.id);
  save(READ_KEY, [...readIds]);
  setTimeout(render, 300);
});
document.getElementById("readAll").addEventListener("click", () => {
  if (!data) return;
  data.tabs.forEach(t => t.items.forEach(it => readIds.add(it.id)));
  save(READ_KEY, [...readIds]);
  render();
});
document.getElementById("refresh").addEventListener("click", refresh);
// 홈 화면 앱으로 쓰다가 다시 열면 자동으로 최신 목록 확인
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

refresh();
</script>
</body>
</html>
